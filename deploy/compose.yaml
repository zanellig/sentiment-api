# Postgres and Redis for local runs and the integration tests.
# docker compose -f deploy/compose.yaml up -d --wait
# With the gateway in front of the Jobs API (deploy/tests):
# docker compose -f deploy/compose.yaml --profile gateway up -d --wait --build
name: voice-insights

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs
      POSTGRES_DB: jobs
    ports: ["127.0.0.1:55432:5432"]
    networks: [default, internal]
    healthcheck:
      # Over TCP: the init-time server listens on the socket only and would pass too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U jobs -d jobs"]
      interval: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    networks: [default, internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  # No published port: the gateway is the only way in (ADR-0020).
  jobs-api:
    profiles: [gateway]
    build:
      context: ..
      dockerfile: services/jobs-api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://jobs:jobs@postgres:5432/jobs
      CELERY_BROKER_URL: redis://redis:6379/0
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"]
      interval: 2s
      retries: 15

  apisix:
    profiles: [gateway]
    image: apache/apisix:3.19.0-debian
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports: ["127.0.0.1:59080:9080"]
    networks: [default, internal]
    depends_on:
      jobs-api: { condition: service_healthy }

networks:
  internal:
    internal: true
