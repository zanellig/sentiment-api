routes:
  - id: jobs-api
    uris: ["/jobs", "/jobs/*"]
    upstream:
      type: roundrobin
      nodes:
        "jobs-api:8000": 1
    plugins:
      # key-auth 3.19 also reads the key from ?apikey= and, when both are sent, hides only the
      # header. It has no option to turn the query off, and route vars or uri-blocker see the
      # raw query (?api%6Bey= gets past them), so this runs first and rejects any apikey
      # argument through the same decoded lookup key-auth uses.
      serverless-pre-function:
        phase: rewrite
        functions:
          - |
            return function(conf, ctx)
              if require("apisix.core").request.get_uri_args(ctx).apikey ~= nil then
                return 400, { message = "Send the API key in the apikey header only" }
              end
            end
      # Sets X-Consumer-Username over any client copy; the Jobs API trusts it alone (ADR-0020).
      # deploy/tests checks this on every APISIX bump.
      key-auth:
        hide_credentials: true

# One consumer per Tenant; the username is the tenant_id.
# shortcut: static dev-only consumers, until the Jobs API creates them through the Admin API (#14).
consumers:
  - username: initech
    plugins:
      key-auth:
        key: dev-only-initech-key
      limit-count: &limit
        count: 600
        time_window: 60
        key_type: var
        key: consumer_name
        rejected_code: 429
  - username: umbrella
    plugins:
      key-auth:
        key: dev-only-umbrella-key
      limit-count: *limit
#END
