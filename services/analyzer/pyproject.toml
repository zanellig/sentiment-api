[project]
name = "analyzer"
version = "1.0.0"
description = "Legacy pysentimiento HTTP service, becoming the Analyzer worker"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi",
    "pysentimiento",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "torch",
    "celery[redis]",
    "contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "src/analyzer"]
