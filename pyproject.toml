[project]
name = "voice-insights"
version = "0.1.0"
description = "Audio analysis pipeline: Jobs API, Transcriber and Analyzer"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["analyzer", "contracts", "jobs-api"]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.uv.workspace]
members = ["services/*", "packages/*"]

[tool.uv.sources]
analyzer = { workspace = true }
contracts = { workspace = true }
jobs-api = { workspace = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["services/analyzer/tests", "services/api/tests", "packages/contracts/tests"]
# main.py sits beside app/ and is not part of the installed package
pythonpath = ["services/analyzer"]
