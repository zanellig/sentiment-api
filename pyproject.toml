[project]
name = "voice-insights"
version = "0.1.0"
description = "Audio analysis pipeline: Jobs API, Transcriber and Analyzer"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["analyzer", "contracts", "jobs-api"]

[dependency-groups]
dev = ["pytest", "httpx", "basedpyright==1.40.2", "ruff==0.17.4", "celery-types==0.26.0"]

[tool.uv.workspace]
members = ["services/*", "packages/*"]

[tool.uv.sources]
analyzer = { workspace = true }
contracts = { workspace = true }
jobs-api = { workspace = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = [
    "services/analyzer/tests",
    "services/jobs-api/tests",
    "packages/contracts/tests",
    "deploy/tests",
]
# main.py sits beside app/ and is not part of the installed package
pythonpath = ["services/analyzer"]

[tool.basedpyright]
include = [
    "packages/contracts/src",
    "services/analyzer/src",
    "services/jobs-api/src",
]
# The legacy synchronous service is deleted by #12, not typed.
exclude = ["services/analyzer/app"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
