name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      # Fail instead of skipping the integration tests when Postgres, Redis or the gateway is missing.
      REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: docker compose -f deploy/compose.yaml --profile gateway up -d --wait --build
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run basedpyright
      - run: uv run pytest
      - if: always()
        run: docker compose -f deploy/compose.yaml --profile gateway down -v
